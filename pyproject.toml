[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncotme"
version = "0.1.0"
description = "Tumor microenvironment as prognostic and predictive biomarker in breast cancer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "D. Lysenko" }]
license = { text = "Research use" }

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "statsmodels>=0.14",
  "gseapy>=1.1",
  "mygene>=3.2",
  "lifelines>=0.27",
  "scikit-survival>=0.22",
  "shap>=0.44",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "joblib>=1.3",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]
scrna = ["anndata>=0.10", "scanpy>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
